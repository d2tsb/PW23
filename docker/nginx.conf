server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;

    # BrowserRouter: /impressum existiert nur clientseitig. Ohne diese Zeile
    # sucht nginx eine gleichnamige Datei und liefert 404, sobald jemand die
    # URL direkt aufruft oder dort neu lädt. Navigation aus der App heraus
    # funktioniert trotzdem - deshalb wird der Fehler leicht übersehen.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hängt jedem Asset einen Inhalts-Hash an den Dateinamen. Ändert sich
    # der Inhalt, ändert sich der Name - die Datei selbst darf deshalb beliebig
    # lange gecacht werden.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html trägt keinen Hash und verweist auf die gehashten Assets.
    # Würde sie mitgecacht, sähen Besucher nach einem Deploy weiterhin die alte
    # Version - der Rest des Cachings wäre damit wirkungslos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript image/svg+xml application/json;
}
